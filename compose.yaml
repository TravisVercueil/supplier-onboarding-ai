services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: supplier
      POSTGRES_USER: supplier
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-demo-change-me}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5434}:5432"
    volumes:
      - supplier-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U supplier"]
      interval: 5s
      timeout: 3s
      retries: 10
volumes:
  supplier-data:
